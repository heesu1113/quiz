<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나에게 어울리는 책 & 세계 간식</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf8f4;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e8e4dc;
    --accent-a: #4a6fa5;
    --accent-b: #c0522a;
    --accent-c: #3a7d5e;
    --accent-d: #b07d2a;
    --radius: 14px;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px 80px;
  }

  .container {
    width: 100%;
    max-width: 520px;
  }

  .top-label {
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    text-align: center;
  }

  .main-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 26px;
    font-weight: 600;
    text-align: center;
    line-height: 1.4;
    margin-bottom: 10px;
    color: var(--text);
  }

  .intro-sub {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
    margin-bottom: 32px;
  }

  .type-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 36px;
  }

  .type-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .type-chip strong {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }

  .btn-start {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-start:hover { opacity: 0.85; }

  .screen { display: none; }
  .screen.active { display: block; }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .progress-track {
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    margin-bottom: 36px;
  }

  .progress-fill {
    height: 3px;
    background: var(--text);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .q-num {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .q-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 28px;
    color: var(--text);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .opt-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    line-height: 1.6;
    transition: all 0.15s;
  }

  .opt-btn:hover {
    border-color: #aaa;
    background: #f5f3ef;
  }

  .opt-btn.selected {
    border-color: var(--text);
    background: var(--text);
    color: #fff;
    font-weight: 500;
  }

  /* Result */
  .result-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 99px;
    margin-bottom: 14px;
    letter-spacing: 0.04em;
  }

  .result-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .result-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.9;
    margin-bottom: 28px;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
  }

  .result-card-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .result-card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.5;
  }

  .result-card-sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
  }

  .score-section { margin-bottom: 24px; }
  .score-section-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .score-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .score-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    width: 18px;
  }

  .score-track {
    flex: 1;
    height: 5px;
    background: var(--border);
    border-radius: 99px;
  }

  .score-fill {
    height: 5px;
    border-radius: 99px;
    transition: width 0.7s ease;
  }

  .score-pct {
    font-size: 12px;
    color: var(--muted);
    width: 30px;
    text-align: right;
  }

  .btn-restart {
    display: block;
    width: 100%;
    padding: 15px;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    margin-bottom: 10px;
    transition: opacity 0.2s;
  }

  .btn-restart:hover { opacity: 0.85; }

  @media (max-width: 400px) {
    .main-title { font-size: 22px; }
    .q-text { font-size: 18px; }
    .type-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- INTRO -->
  <div class="screen active" id="screen-intro">
    <p class="top-label">자가진단 테스트</p>
    <h1 class="main-title">나에게 어울리는<br>책 &amp; 세계 간식</h1>
    <p class="intro-sub">7가지 질문에 답하면 당신의 여행 감성 유형과<br>어울리는 책 스타일과 세계 간식을 알려드려요.</p>
    <div class="type-grid">
      <div class="type-chip"><strong>🇫🇷 A 유형</strong>여유로운 유럽 여행자</div>
      <div class="type-chip"><strong>🇨🇳 B 유형</strong>화려한 도시 탐험가</div>
      <div class="type-chip"><strong>🇯🇵 C 유형</strong>고즈넉한 소도시 여행자</div>
      <div class="type-chip"><strong>🌴 D 유형</strong>열정적인 동남아 여행자</div>
    </div>
    <button class="btn-start" onclick="startQuiz()">테스트 시작하기</button>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz">
    <div class="progress-meta">
      <span id="q-progress-text">1 / 7</span>
      <span id="q-progress-pct">14%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:14%"></div>
    </div>
    <p class="q-num" id="q-num">Q1</p>
    <p class="q-text" id="q-text"></p>
    <div class="options" id="options"></div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="result-badge" id="result-badge"></div>
    <h2 class="result-title" id="result-title"></h2>
    <p class="result-desc" id="result-desc"></p>
    <div class="result-card">
      <p class="result-card-label">📖 어울리는 책 스타일</p>
      <p class="result-card-title" id="result-book-title"></p>
      <p class="result-card-sub" id="result-book-sub"></p>
    </div>
    <div class="result-card">
      <p class="result-card-label" id="result-snack-label"></p>
      <p class="result-card-title" id="result-snack-title"></p>
      <p class="result-card-sub" id="result-snack-sub"></p>
    </div>
    <hr class="divider">
    <div class="score-section">
      <p class="score-section-label">유형별 점수 분포</p>
      <div id="score-bars"></div>
    </div>
    <button class="btn-restart" onclick="restartQuiz()">다시 테스트하기</button>
  </div>

</div>

<script>
const questions = [
  {
    text: "여행지에서 가장 기대되는 순간은?",

  },
  {

      { text: "많이 보고 많이 찍기, 빽빽한 일정", type: "B" },
      { text: "계획 없이 발길 닿는 대로", type: "C" },
      { text: "낮에는 관광, 밤에는 신나게 놀기", type: "D" }
    ]
  },
  {
    text: "여행 사진 스타일을 고른다면?",

    ]
  },
  {
    text: "여행 중 먹고 싶은 식사는?",
    options: [
      { text: "작은 비스트로에서 코스 요리 천천히", type: "A" },
      { text: "미슐랭 레스토랑 또는 유명 맛집", type: "B" },
      { text: "현지 시장 아침 정식", type: "C" },
      { text: "노점에서 먹는 빠르고 강렬한 음식", type: "D" }
    ]
  },
  {
    text: "여행 후 집에 오면 가장 먼저 하고 싶은 것은?",
    options: [
      { text: "따뜻한 차 한 잔과 함께 일기 쓰기", type: "A" },
      { text: "SNS에 여행 사진 정리해서 올리기", type: "B" },
      { text: "조용히 앉아 여운 느끼기", type: "C" },
      { text: "친구들에게 여행 얘기 신나게 풀기", type: "D" }
    ]
  }
];

const results = {
  A: {
    badge: "🇫🇷 A 유형", bgColor: "#deeaf7", textColor: "#2a5080",
    title: "여유를 중시하는 유럽 여행자",
    desc: "당신은 빠른 속도보다 깊은 감상을 즐기는 타입이에요. 카페 한 켠에 앉아 시간이 흐르는 걸 느끼고, 낯선 도시의 공기를 천천히 들이쉬는 여행자죠.",
    bookTitle: "조용한 사색과 삶의 아름다움을 담은 에세이-끌림/이병률 작가 추천해요",
    bookSub: "여행의 의미, 일상의 소중함을 잔잔한 문체로 풀어낸 책이 잘 어울려요. 파리나 리스본 같은 도시의 골목을 배경으로 한 여행 에세이도 추천.",
    snackLabel: "🥐 유럽의 여유로운 간식",
    snackTitle: "크루아상 & 마카롱 (프랑스)",
    snackSub: "버터 향 가득한 크루아상과 달콤한 마카롱. 카페 테이블 위에 올려두고 책 한 페이지 읽으면 완벽한 당신의 시간.",
    barColor: "#4a6fa5"
  },
  B: {
    badge: "🇨🇳 B 유형", bgColor: "#fbe0d4", textColor: "#903c1a",
    title: "화려한 도시를 선호하는 탐험가",
    desc: "당신은 에너지 넘치는 도시의 스카이라인과 불빛에 설레는 타입이에요. 트렌디한 공간과 핫플을 직접 발로 뛰며 정복하는 여행을 좋아하죠.",
    bookTitle: "성장과 도전, 화려한 세계를 담은 논픽션",

    snackTitle: "탕후루 & 월병 (중국)",
    snackSub: "화려하게 빛나는 탕후루와 정교하게 만들어진 월병. 도시의 불빛처럼 강렬하고 인상적인 맛이에요.",
    barColor: "#c0522a"
  },
  C: {
    badge: "🇯🇵 C 유형", bgColor: "#d4ede2", textColor: "#1f6644",

    desc: "당신은 화려함보다 깊이 있는 분위기에 끌리는 타입이에요. 붐비지 않는 골목, 오래된 찻집, 계절의 냄새를 느끼는 여행을 꿈꾸죠.",
    bookTitle: "서정적이고 계절감 있는 일본 소설",
    bookSub: "무라카미 하루키처럼 조용하고 섬세한 감성의 소설이 잘 어울려요. 인물의 내면을 천천히 따라가는 문학, 계절과 풍경이 글에 스며든 작품 추천.",
    snackLabel: "🍡 일본 소도시 감성 간식",
    snackTitle: "모나카 & 와라비 모찌 (일본)",
    snackSub: "얇은 껍질 안에 팥소를 품은 모나카, 쫀득한 와라비 모찌. 조용한 찻집에서 말차와 함께 먹으면 당신의 여행 감성 그 자체.",
    barColor: "#3a7d5e"
  },
  D: {
    badge: "🌴 D 유형", bgColor: "#faeacf", textColor: "#7a530e",

    desc: "당신은 뜨겁고 생동감 넘치는 에너지를 사랑하는 타입이에요. 강렬한 태양 아래 현지인과 어울리고, 낯선 자극을 두려워하지 않는 여행자죠.",
    bookTitle: "모험과 생존, 날 것의 삶을 담은 이야기",
    bookSub: "정글 트레킹, 배낭여행, 낯선 문화 속 성장을 다룬 논픽션이나 여행기가 잘 맞아요. 동남아를 배경으로 한 힐링 또는 모험 서사도 추천.",
    snackLabel: "🌶 동남아의 뜨거운 간식",

    snackSub: "달콤하고 진한 망고 찹쌀밥, 더위를 날려주는 코코넛 아이스크림. 뜨겁고 강렬한 당신의 여행처럼 잊을 수 없는 맛이에요.",
    barColor: "#b07d2a"
  }
};

let scores, current, answers;

function startQuiz() {
  scores = { A:0, B:0, C:0, D:0 };
  answers = [];
  current = 0;
  showScreen('screen-quiz');
  renderQ();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function renderQ() {
  const q = questions[current];
  const total = questions.length;
  const pct = Math.round(((current+1)/total)*100);
  document.getElementById('q-progress-text').textContent = `${current+1} / ${total}`;
  document.getElementById('q-progress-pct').textContent = `${pct}%`;
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('q-num').textContent = `Q${current+1}`;
  document.getElementById('q-text').textContent = q.text;
  const box = document.getElementById('options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'opt-btn' + (answers[current]===i?' selected':'');
    b.textContent = opt.text;
    b.onclick = () => pick(i, opt.type);
    box.appendChild(b);
  });
}

function pick(idx, type) {
  answers[current] = idx;
  scores[type]++;
  document.querySelectorAll('.opt-btn').forEach((b,i)=>b.classList.toggle('selected',i===idx));
  setTimeout(()=>{
    current++;
    if(current < questions.length) renderQ();
    else showResult();
  }, 320);
}

function showResult() {
  const top = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
  const r = results[top];
  const total = questions.length;
  const badge = document.getElementById('result-badge');
  badge.textContent = r.badge;
  badge.style.background = r.bgColor;
  badge.style.color = r.textColor;
  document.getElementById('result-title').textContent = r.title;
  document.getElementById('result-desc').textContent = r.desc;
  document.getElementById('result-book-title').textContent = r.bookTitle;
  document.getElementById('result-book-sub').textContent = r.bookSub;
  document.getElementById('result-snack-label').textContent = r.snackLabel;
  document.getElementById('result-snack-title').textContent = r.snackTitle;
  document.getElementById('result-snack-sub').textContent = r.snackSub;
  const bars = document.getElementById('score-bars');
  bars.innerHTML = '';
  ['A','B','C','D'].forEach(t=>{
    const pct = Math.round((scores[t]/total)*100);
    bars.innerHTML += `<div class="score-row">
      <span class="score-label">${t}</span>
      <div class="score-track"><div class="score-fill" style="width:${pct}%;background:${results[t].barColor}"></div></div>
      <span class="score-pct">${pct}%</span>
    </div>`;
  });
  showScreen('screen-result');
}

function restartQuiz() {
  scores = { A:0,B:0,C:0,D:0 };
  answers = [];
  current = 0;
  showScreen('screen-intro');
}
</script>
</body>
</html>
